version: "3.9"

services:
  backend:
    build: ./backend
    container_name: twitter-backend
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  frontend:
    build: ./frontend/twitter
    container_name: twitter-frontend
    expose:
      - "80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: twitter-mongo
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:latest
    container_name: twitter-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend

volumes:
  mongo-data:
    