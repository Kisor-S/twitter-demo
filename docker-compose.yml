version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - 5001:5001
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  frontend:
    build: ./frontend/twitter
    ports:
      - 3000:80
    depends_on:
      - backend

  mongo:
    image: mongo:7
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    